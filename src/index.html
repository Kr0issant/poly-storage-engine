<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Media Upload Form</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="view-options">
        <button id="view-media-btn">Media</button>
        <button id="view-sql-btn">SQL</button>
        <button id="view-nosql-btn">NoSQL</button>
    </div>

    <div class="main-container">
        <div class="explorer">
            <div class="media">
                <div class="search-container">
                    <button class="media-back-btn"><img src="./icons/left.png" height="40px"></button>
                    <form id="search-form" action="http://localhost:8000/search" method="GET">
                        <input type="text" id="search-bar" placeholder="Search">
                        <button type="submit" id="search-btn"><img src="./icons/search.png" height="15px" style="filter: brightness(0) invert(1);"></button>
                    </form>
                </div>
                
                <div class="filesystem"></div>
            </div>

            <div class="sql">

            </div>

            <div class="nosql">

            </div>
        </div>
        
        <form class="upload-form" action="http://localhost:8000/upload" method="POST" enctype="multipart/form-data">
            <h2>Upload Your Media</h2>
            
            <div class="form-group">
                <div class="drop-area">
                    <label for="file-upload" class="file-label">Choose Files<br>Drag and Drop</label>
                    <input id="file-upload" class="file-input" type="file" name="mediaUpload" accept="image/*, video/*" multiple>
                </div>
                <span class="file-name" id="file-name-display">No file chosen</span>
            </div>
            
            <button id="submit-button" type="submit" class="submit-btn">Upload Media</button>

            <progress value="0" max="100" id="progress-bar" class="hidden"></progress>
            
            <div id="results-container" style="display: none;"></div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>

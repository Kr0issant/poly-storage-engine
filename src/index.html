<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Media Upload Form</title>
</head>
<body>
    <div class="container">
        <form class="upload-form" action="http://localhost:8000/upload/media" method="POST" enctype="multipart/form-data">
            <h2>Upload Your Media</h2>
            
            <div class="form-group">
                <label for="file-upload" class="file-label">Choose Files</label>
                <input id="file-upload" class="file-input" type="file" name="mediaUpload" accept="image/*, video/*" multiple>
                <span class="file-name" id="file-name-display">No file chosen</span>
            </div>
            
            <button id="submit-button" type="submit" class="submit-btn">Upload Media</button>
        </form>
        
        <div id="results-container" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
